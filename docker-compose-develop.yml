services:
  mongo1:
    image: mongo:6.0
    container_name: mongo1
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27020:27017"
    networks:
      - mdm-net

  mongo-init:
    image: mongo:6.0
    container_name: mongo-init
    depends_on:
      - mongo1
    entrypoint: ["sh", "-c", "sleep 10 && mongosh --host mongo1 --eval '
      rs.initiate({ 
        _id: \"rs0\", 
        members: [
          { _id: 0, host: \"mongo1\" }
        ]
      })'"]
    networks:
      - mdm-net

networks:
  mdm-net:
    driver: bridge